## CLARIN.SI: the Slovenian CLARIN consortium

<div class="cols w60">
<div>
<ul>
<li>National consortium of <strong>CLARIN ERIC</strong>, the European research infrastructure for language resources and technologies</li>
<li>Working since <strong>2015</strong>, with its seat at the <strong>Jožef Stefan Institute</strong></li>
<li>Focus on <strong>Slovenian and the other South Slavic languages</strong>, open to all languages</li>
<li>Serves the humanities, the social sciences and everyone who works with language data, including AI developers</li>
<li>Funded by the Slovenian Ministry of Education, Science and Sport and the Ministry of Culture</li>
</ul>
</div>
<div>
<div class="stats" style="--n:1">
<div class="stat"><div class="num">12 partners</div><div class="lbl">4 universities · 4 research institutes · the National and University Library · the Slovenian Language Technologies Society · 2 companies</div></div>
</div>
</div>
</div>

<p class="tiny">Sources: <a href="https://www.clarin.si/info/about/">clarin.si/info/about</a>, <a href="https://www.clarin.si/info/partners/">clarin.si/info/partners</a></p>

Note:
Partners: Alpineon, Amebis, Jožef Stefan Institute, Institute of Contemporary History, National and University Library, Slovenian Language Technologies Society, Universities of Ljubljana, Maribor, Nova Gorica and Primorska, ZRC SAZU, and the Science and Research Centre Koper.

---

## What CLARIN.SI runs

<div class="cards" style="--n:2">
<div class="card"><h3>Repository</h3><p>Certified with the <strong>CoreTrustSeal</strong> and as a <strong>CLARIN B-centre</strong>. FAIR deposits with persistent handles, explicit licences and versioning. About 9 TB of data in more than 90 languages.</p></div>
<div class="card"><h3>Concordancers</h3><p>noSketch Engine and KonText over <strong>100+ corpora in 30+ languages</strong> (about 20B words). About <strong>1 million queries</strong> a year (Dec 2024 to Dec 2025, up 45%).</p></div>
<div class="card"><h3>Tools and services</h3><p>CLASSLA-Stanza pipeline, WebAnno, CQP/Tree syntactic search, SENTA, Korpusnik, an LLM benchmarks dashboard; code on GitHub.</p></div>
<div class="card"><h3>Knowledge centres</h3><p>CLASSLA (South Slavic languages), ELEXIS (lexicography), LLMs4SSH (large language models for the social sciences and humanities), CKCMC (computer-mediated communication).</p></div>
</div>

<p class="tiny">Sources: <a href="https://www.clarin.si/info/about/">clarin.si/info/about</a>, <a href="https://www.clarin.si/info/concordances/">clarin.si/info/concordances</a>, CLARIN.SI presentation, January 2026</p>

---

## Why a research repository matters for AI

<div class="cols">
<div>
<h3>What you get</h3>
<ul>
<li><strong>A licence on every record</strong>, so you know whether you may train on it</li>
<li><strong>Persistent handles</strong> to cite and to pin in data cards</li>
<li><strong>Versions</strong> you can reproduce a training run against</li>
<li><strong>Rich metadata</strong>: size, languages, genre, annotation layers</li>
<li>Data <strong>curated by the people who built it</strong>, often with a paper</li>
</ul>
</div>
<div>
<h3>What to watch for</h3>
<ul>
<li>Several versions of the same corpus; take the latest</li>
<li>Corpora that repackage other corpora; deduplicate</li>
<li>Non-commercial and academic-only licences</li>
<li>Records that only describe data hosted elsewhere</li>
</ul>
</div>
</div>

## Reading the licences

<table>
<tr><th>Licence on the record</th><th>Training a model</th><th>Commercial use</th><th class="r">Resources</th></tr>
<tr><td>CC0, CC BY, CC BY-SA, Apache, MIT, GPL</td><td><span class="tag ok">yes</span></td><td><span class="tag ok">yes</span></td><td class="r">791</td></tr>
<tr><td>CC BY-NC, CC BY-NC-SA, CC BY-NC-ND, MULTEXT-East</td><td><span class="tag nc">research only</span></td><td><span class="tag no">no</span></td><td class="r">79</td></tr>
<tr><td>ACA (academic users), CLARIN.SI web-corpus licence</td><td><span class="tag nc">after sign-in, academic use</span></td><td><span class="tag no">no</span></td><td class="r">23</td></tr>
<tr><td>No licence, no files</td><td><span class="tag no">access elsewhere</span></td><td><span class="tag no">check provider</span></td><td class="r">146</td></tr>
</table>

<div class="callout">A rough guide only. Check the licence text, and how attribution and share-alike apply to model weights and outputs, before you train.</div>

Note:
No-derivatives (ND) licences are the most restrictive for training, because a model can be seen as a derivative.

## Pre-training checklist

<div class="cols">
<div>
<h3>Choosing</h3>
<ol>
<li>Prefer the <strong>latest version</strong> of each resource</li>
<li>Check the <strong>licence tier</strong> against your use</li>
<li>Pick the <strong>newest crawl</strong> per language, add older ones for diversity</li>
<li>Use <strong>genre and topic labels</strong> to balance the mix</li>
</ol>
</div>
<div>
<h3>Processing</h3>
<ol start="5">
<li><strong>Deduplicate</strong> across collections</li>
<li>Expect formats: vertical, CoNLL-U, TEI, JSONL, plain text</li>
<li>Strip or keep annotation layers (lemmas, UD, NER) as needed</li>
<li>Cite the <strong>handle</strong> in your data card</li>
</ol>
</div>
</div>

<p class="small">All pre-training resources: <a href="https://clarinsi.github.io/clarinsi4ai/01-pretraining.html">clarinsi.github.io/clarinsi4ai/01-pretraining.html</a></p>

<div class="cards" style="--n:4">
<div class="card"><h3>10</h3><p><strong>Text-to-text</strong>: grammatical error correction (Šolar 3.0), normalisation (Janes-Norm), simplification, summarisation (KAS-Sum), post-OCR.</p></div>

## Example: is this web corpus right for my domain?

<div class="cols">
<div>
<ol class="small">
<li>Open <a href="https://www.clarin.si/ske/#open">noSketch Engine</a> and select a CLASSLA-web corpus</li>
<li>Search a domain term, e.g. <code>[lemma="zdravilo"]</code> (medicine)</li>
<li>Open <strong>text types</strong>: which genres and domains does it come from?</li>
<li>Read 50 concordance lines: boilerplate, machine translation, spam?</li>
<li>Compute <strong>collocations</strong> and a <strong>frequency list</strong> by genre</li>
<li>Download the corpus from its repository handle, filtered by the genres that worked</li>
</ol>

## What is missing for modern AI development

<ol class="small">
<li><strong>No preference data and little dialogue data.</strong> Text instructions are single-turn and 98% medical or pharmaceutical; only SLO-VLM-IT has (machine-generated) conversations.</li>
<li><strong>Instruction data exists only for Slovenian.</strong> Croatian, Serbian, Bosnian, Montenegrin, Macedonian and Bulgarian have large web corpora but no instruction or safety data.</li>
<li><strong>Evaluation for other South Slavic languages is thin.</strong> Beyond COPA, only PragMega, CoSimLex, AspectBench and word analogies cover them.</li>
<li><strong>Almost no speech data for Bosnian, Montenegrin, Macedonian or Bulgarian.</strong> ParlaSpeech 4.0 covers Croatian, Czech, Polish, Serbian and Slovenian; Bosnian has only small heritage-speaker sets.</li>
<li><strong>The largest curated Slovenian corpora cannot be downloaded.</strong> metaFida, Gigafida and Trendi are concordancer-only.</li>
<li><strong>Metadata does not describe AI readiness.</strong> 725 free keywords, and formats often hidden in zip files.</li>
</ol>
