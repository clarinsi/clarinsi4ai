<text x="120" y="123" text-anchor="end" fill="#1f2328">Czech</text>
<rect x="130" y="110" width="171.1" height="18" rx="2" fill="#c9c7bd"/>
<text x="307.1" y="123" fill="#1f2328">2,436 h</text>
<text x="120" y="149" text-anchor="end" fill="#1f2328">Polish</text>
