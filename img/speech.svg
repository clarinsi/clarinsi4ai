<text x="277.9" y="149" fill="#1f2328">2,020 h</text>
<text x="120" y="175" text-anchor="end" fill="#1f2328">Slovenian</text>
<rect x="130" y="162" width="141.7" height="18" rx="2" fill="#2f6fd6"/>
