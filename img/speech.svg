<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" width="760" height="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12">
<rect width="760" height="234" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="600" fill="#1f2328">Croatian has 6,100 hours of speech; Slovenian, Serbian, Czech and Polish about 2,000 each</text>
<text x="20" y="54" fill="#59636e">Hours of recorded speech per language (single-language resources, duplicate releases removed). South Slavic languages in blue.</text>
<text x="120" y="97" text-anchor="end" fill="#1f2328">Croatian</text>
<rect x="130" y="84" width="430.0" height="18" rx="2" fill="#2f6fd6"/>
